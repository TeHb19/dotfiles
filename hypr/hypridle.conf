general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
  }

listener {
    timeout = 120
    on-timeout = brightnessctl --device=$(sh ~/dotfiles/scripts/get_gpu_name.sh) -s set 30%
    on-resume  = brightnessctl -r --device=$(sh ~/dotfiles/scripts/get_gpu_name.sh)
  }

listener {
    timeout = 180
    on-timeout = brightnessctl --device=$(sh ~/dotfiles/scripts/get_gpu_name.sh) set 25%
    on-resume  = brightnessctl -r --device=$(sh ~/dotfiles/scripts/get_gpu_name.sh)
  }

listener {
    timeout = 300
    on-timeout = brightnessctl --device=$(sh ~/dotfiles/scripts/get_gpu_name.sh) set 5%
    on-resume  = brightnessctl -r --device=$(sh ~/dotfiles/scripts/get_gpu_name.sh)
  }


listener {
    timeout = 350
    on-timeout = brightnessctl -sd asus::kbd_backlight set 0 && hyprlock
    on-resume  = brightnessctl -rd asus::kbd_backlight
  }

listener {
     timeout = 360
     on-timeout = loginctl lock-session
  }

listener {
     timeout = 420
     on-timeout = hyprctl dispatch dpms off
     on-resume  = hyprctl dispatch dpms on
  }

